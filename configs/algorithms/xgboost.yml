# xgboost: fixed parameters, grid, and adaptive search.
# order preserves historical grid enumeration.
order: 40
fixed:
  objective: binary:logistic
  eval_metric: logloss
  tree_method: hist
  device: cpu
  n_jobs: 4
  verbosity: 0
  subsample: 0.8
  colsample_bytree: 0.8
  reg_lambda: 1.0
grid:
  n_estimators:
  - 200
  - 500
  max_depth:
  - 3
  - 6
  learning_rate:
  - 0.03
  - 0.1
optuna:
  trials: 100
  space:
    n_estimators:
      type: int
      low: 200
      high: 1500
    learning_rate:
      type: float
      low: 0.005
      high: 0.2
      log: true
    max_depth:
      type: int
      low: 2
      high: 8
    min_child_weight:
      type: float
      low: 1.0
      high: 20.0
      log: true
    gamma:
      type: float
      low: 0.0
      high: 5.0
    subsample:
      type: float
      low: 0.6
      high: 1.0
    colsample_bytree:
      type: float
      low: 0.6
      high: 1.0
    reg_alpha:
      type: float
      low: 0.0
      high: 5.0
    reg_lambda:
      type: float
      low: 0.01
      high: 30.0
      log: true
    scale_pos_weight:
      type: float
      low: 1.0
      high: 3.5
  enqueue:
  - variant: baseline
    params:
      n_estimators: 500
      learning_rate: 0.03
      max_depth: 6
      min_child_weight: 1.0
      gamma: 0.0
      subsample: 0.8
      colsample_bytree: 0.8
      reg_alpha: 0.0
      reg_lambda: 1.0
      scale_pos_weight: 1.0
