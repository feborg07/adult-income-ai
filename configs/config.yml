# Sprint 17 — model-training configuration
# Lists in "grid" are Cartesian products in full mode.
# Quick mode uses the first combination from each family.
seed: 42
variants: [baseline, robust, interactions]
selection_metric: val_f1
paths:
  processed_dir: data/processed
  preprocessor_dir: models/preprocessors
  output_dir: models/runs
  mlflow_db: mlflow.db
  mlflow_artifacts: mlartifacts
mlflow:
  experiment: adult-income-saved-splits
models:
  logistic_regression:
    fixed:
      max_iter: 5000
      solver: lbfgs
      tol: 0.0001
    grid:
      C: [0.1, 1.0, 10.0]
      class_weight: [null, balanced]
  random_forest:
    fixed:
      n_estimators: 150
      n_jobs: -1
    grid:
      max_depth: [null, 15]
      min_samples_leaf: [1, 5]
  hist_gradient_boosting:
    fixed:
      max_iter: 150
    grid:
      learning_rate: [0.05, 0.1]
      max_leaf_nodes: [15, 31]
  extra_trees:
    fixed:
      n_estimators: 150
      n_jobs: -1
    grid:
      max_depth: [null, 15]
      min_samples_leaf: [1, 5]
  # CPU-only boosting candidates; keep the existing processed features.
  xgboost:
    fixed:
      objective: binary:logistic
      eval_metric: logloss
      tree_method: hist
      device: cpu
      n_jobs: 4
      verbosity: 0
      subsample: 0.8
      colsample_bytree: 0.8
      reg_lambda: 1.0
    grid:
      n_estimators: [200, 500]
      max_depth: [3, 6]
      learning_rate: [0.03, 0.1]
  catboost:
    fixed:
      loss_function: Logloss
      task_type: CPU
      thread_count: 4
      verbose: false
      allow_writing_files: false
      l2_leaf_reg: 3.0
    grid:
      iterations: [200, 500]
      depth: [4, 6]
      learning_rate: [0.03, 0.1]
  lightgbm:
    fixed:
      objective: binary
      boosting_type: gbdt
      device_type: cpu
      n_jobs: 4
      verbosity: -1
      deterministic: true
      force_col_wise: true
      min_child_samples: 20
      subsample: 0.8
      subsample_freq: 1
      colsample_bytree: 0.8
      reg_lambda: 1.0
    grid:
      n_estimators: [200, 500]
      num_leaves: [15, 31]
      learning_rate: [0.03, 0.1]
