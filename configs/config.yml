# Adult Income AI: shared training configuration.
# Model-specific defaults are discovered in algorithms/.
# CV is validation-only; Optuna budgets are cumulative.
seed: 42
variants:
- baseline
- robust
- interactions
selection_metric: val_f1
cv_representation: no_fnlwgt
cross_validation:
  n_splits: 3
  calibration_size: 0.2
optuna:
  sampler: tpe
  n_startup_trials: 5
  storage_path: models/optimization/optuna.db
paths:
  processed_dir: data/processed
  preprocessor_dir: models/preprocessors
  output_dir: models/runs
  mlflow_db: mlflow.db
  mlflow_artifacts: mlartifacts
mlflow:
  experiment: adult-income-saved-splits
algorithms_dir: algorithms
