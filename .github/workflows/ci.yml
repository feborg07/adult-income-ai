name: MLOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================================
  # JOB 1 — AUTOMATED TESTING
  # ============================================================
  test:
    name: Python Unit Tests
    runs-on: ubuntu-24.04

    steps:
      # 1. Retrieve repository source code.
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure Python.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # 3. Install project dependencies AND S3 support for DVC.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "dvc[s3]==3.67.1"

      # 4. Real-data and inference tests require the dataset and approved reference.
      # Public-read S3 objects can be downloaded without AWS credentials.
      - name: Pull DVC test artifacts
        run: |
          dvc pull data/raw.dvc models/reference.dvc --verbose

      # 5. Execute complete test suite, including real-data validation.
      - name: Run unit and integration tests
        run: |
          python -m pytest tests/ -v

  # ============================================================
  # JOB 2 — TRAINING AND PERFORMANCE VALIDATION
  # ============================================================
  train:
    name: CV Training Smoke Check
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      MIN_CV_F1: "0.65"

    steps:
      # 1. Retrieve repository source code.
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure Python.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # 3. Install project dependencies and DVC S3 support.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "dvc[s3]==3.67.1"

      # 4. Restore version-controlled training data.
      - name: Pull DVC training data
        run: |
          dvc pull data/raw.dvc --verbose

      # 5. Generate preprocessing variants and data splits.
      - name: Run preprocessing
        run: |
          python -m scripts.run_preprocessing

      # 6. Train the first configuration of each configured family and variant.
      # Gate the fresh training-only CV execution; do not access test labels,
      # select a production model, or use historical MLflow scores.
      - name: Train and check CV candidates
        run: |
          python -m scripts.check_ci_training --min-f1 "$MIN_CV_F1"

      # 7. Publish execution summary.
      - name: Write training summary
        if: always()
        run: |
          echo "## Adult Income AI — CI Training" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Training mode: validation-only CV (first configuration)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Minimum mean CV F1: $MIN_CV_F1" >> "$GITHUB_STEP_SUMMARY"
          echo "- Training job status: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Reference model promotion: disabled" >> "$GITHUB_STEP_SUMMARY"

      # 8. Preserve training artifacts for inspection.
      - name: Upload training artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-training-${{ github.run_id }}
          path: |
            models/runs/
          if-no-files-found: warn
          retention-days: 14
